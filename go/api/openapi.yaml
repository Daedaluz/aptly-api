  /api/snapshots/{name}/pull:
    post:
      description: |-
        **Pulls new packages and dependencies from a source snapshot into a new snapshot**

        May also upgrade package versions if name snapshot already contains packages being pulled. New snapshot `Destination` is created as result of this process.
        If architectures are limited (with config architectures or parameter `Architectures`, only mentioned architectures are processed, otherwise aptly will process all architectures in the snapshot.
        If following dependencies by source is enabled (using dependencyFollowSource config), pulling binary packages would also pull corresponding source packages as well.
        By default aptly would remove packages matching name and architecture while importing: e.g. when importing software_1.3_amd64, package software_1.2.9_amd64 would be removed.

        With flag `no-remove` both package versions would stay in the snapshot.

        Aptly pulls first package matching each of package queries, but with flag -all-matches all matching packages would be pulled.
      parameters:
      - description: Name of the snapshot to be created
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: "pull all the packages that satisfy the dependency version requirements\
          \ (default is to pull first matching package): 1 to enable"
        in: query
        name: all-matches
        schema:
          type: integer
      - description: "don’t create destination snapshot, just show what would be pulled:\
          \ 1 to enable"
        in: query
        name: dry-run
        schema:
          type: integer
      - description: "don’t process dependencies, just pull listed packages: 1 to\
          \ enable"
        in: query
        name: no-deps
        schema:
          type: integer
      - description: "don’t remove other package versions when pulling package: 1\
          \ to enable"
        in: query
        name: no-remove
        schema:
          type: integer
      - description: Run in background and return task object
        in: query
        name: _async
        schema:
          type: boolean
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/api.snapshotsPullParams"
        description: Parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deb.Snapshot"
          description: Resulting Snapshot object
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Error
      summary: Snapshot Pull
      tags:
      - Snapshots
      x-codegen-request-body-name: request
