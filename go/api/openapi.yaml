openapi: 3.0.1
info:
  contact:
    name: Aptly
    url: http://github.com/aptly-dev/aptly
  description: |
    Aptly operations are also available via REST API served with `aptly api serve`.

    On Debian based systems, a package `aptly-api` is available, which will run aptly as systemd service as dedicated aptly-api user.

    Some configuration changes (S3 publishing endpoints, ...) will require restarting the aptly service in order to take effect.

    The REST API shouldn't be exposed to the Internet as there is no authentication/protection, consider using a HTTP proxy (e.g. nginx) to add https and authentication.

    #### Aptly REST API Documentation
  title: Aptly API
  version: 1.6.2+20260228114657.9defe70
servers:
- url: /
tags:
- description: |+
    # Manage Local Repositories
    <div>
    A local repository is a collection of versionned packages (usually custom packages created internally).

    Packages can be added, removed, moved or copied between repos.

    Local repositories can be published (either directly or via snapshot) to be used a APT source on a debian based system.
    </div>

  name: Repos
- description: |
    # Upload Package Files
    <div>

    In order to add debian package files to a local repository, files are first uploaded to a temporary directory.
    Then the directory (or a specific file within) is added to a repository. After adding to a repositorty, the directory resp. files are removed bt default.

    All uploaded files are stored under `<rootDir>/upload/<tempdir>` directory.

    For concurrent uploads from CI/CD pipelines, make sure the tempdir is unique.


    </div>
  name: Files
- description: |+
    # Manage Remote Repository Mirrors
    <div>
    Manage mirrors of remote Debian repositories (http, https or ftp).

    Flat debian repositories, mirroring source packages and debian installers is supported.

    </div>

  name: Mirrors
- description: |
    # Manage Snapshots
    <div>

    Local Repositories and Mirrors can be snapshotted to get an immutable state.

    Snapshots cab be merged, filtered, verified for missing dependencies. Snapshots can be published to be used as APT source.

    </div>
  name: Snapshots
- description: |
    # Publish Repositories, Snapshots, Mirrors
    <div>

    Publish snapshot or local repo as Debian repository to be used as APT source on Debian based systems.

    The published repository is signed with the user's GnuPG key.

    Repositories can be published to local directories, Amazon S3 buckets, Azure or Swift Storage.

    #### GPG Keys

    GPG key is required to sign any published repository. The key pari should be generated before publishing.

    Public part of the key should be exported from your keyring using `gpg --export --armor` and imported on the system which uses a published repository.

    * Multiple signing keys can be defined in aptly.conf using the gpgKeys array:
    ```
    "gpgKeys": [
        "KEY_ID_x",
        "KEY_ID_y"
    ]
    ```

    * It is also possible to pass multiple keys via the CLI using the repeatable `--gpg-key` flag:
    ```
    aptly publish repo my-repo --gpg-key=KEY_ID_a --gpg-key=KEY_ID_b
    ```
    * When using the REST API, the `gpgKey` parameter supports a comma-separated list of key IDs:
    ```
    "gpgKey": "KEY_ID_a,KEY_ID_b"
    ```
    * If `--gpg-key` is specified on the command line, or `gpgKey` is provided via the REST API, it takes precedence over any gpgKeys configuration in aptly.conf.
    * With multi-key support, aptly will sign all Release files (both clearsigned and detached signatures) with each provided key, ensuring a smooth key rotation process while maintaining compatibility for existing clients.

    #### Parameters

    Publish APIs use following convention to identify published repositories: `/api/publish/:prefix/:distribution`.  `:distribution` is distribution name, while `:prefix` is `[<storage>:]<prefix>` (storage is optional, it defaults to empty string), if publishing prefix contains slashes `/`, they should be replaced with underscores (`_`) and underscores
    should be replaced with double underscore (`__`). To specify root `:prefix`, use `:.`, as `.` is ambigious in URLs.

    </div>
  name: Publish
- description: |+
    # Search Package Collection
    <div>
    Perform operations on the whole collection of packages in apty database.
    </div>

  name: Packages
- description: |
    # Status Information
    <div>
    Various status information.

    </div>
  name: Status
- description: |
    # Maintenance Operations
    <div>
    Manage aptly’s internal metadata database and package pool.

    </div>
  name: Database
- description: |
    # Background Tasks
    <div>

    Several API operations allow to be run in background asynchronously in a task. In that case, a Task object with an ID and a State is returned, which can be queried for progress.

    Tasks should be deleted once they are no longer in progress, in order to not cause memory overflows.

    </div>
  name: Tasks
paths:
  /api/db/cleanup:
    post:
      description: |-
        **Cleanup Aptly DB**
        Database cleanup removes information about unreferenced packages and deletes files in the package pool that aren’t used by packages anymore.
        It is a good idea to run this command after massive deletion of mirrors, snapshots or local repos.
      parameters:
      - description: Run in background and return task object
        in: query
        name: _async
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: Output
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Not Found
      summary: DB Cleanup
      tags:
      - Database
  /api/files:
    get:
      description: |-
        **Get list of upload directories**

        **Example:**
        ```
        $ curl http://localhost:8080/api/files
        ["aptly-0.9"]
        ```
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: List of files
      summary: List Directories
      tags:
      - Files
  /api/files/{dir}:
    delete:
      description: |-
        **Delete upload directory and uploaded files within**

        **Example:**
        ```
        $ curl -X DELETE http://localhost:8080/api/files/aptly-0.9
        {}
        ```
      parameters:
      - description: Directory
        in: path
        name: dir
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: msg
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Server Error
      summary: Delete Directory
      tags:
      - Files
    get:
      description: |-
        **Show uploaded files in upload directory**

        **Example:**
        ```
        $ curl http://localhost:8080/api/files/aptly-0.9
        ["aptly_0.9~dev+217+ge5d646c_i386.deb"]
        ```
      parameters:
      - description: Directory to list
        in: path
        name: dir
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: Files found in directory
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Server Error
      summary: List Files
      tags:
      - Files
    post:
      description: |-
        **Upload files to a directory**

        - one or more files can be uploaded
        - existing uploaded are overwritten

        **Example:**
        ```
        $ curl -X POST -F file=@aptly_0.9~dev+217+ge5d646c_i386.deb http://localhost:8080/api/files/aptly-0.9
        ["aptly-0.9/aptly_0.9~dev+217+ge5d646c_i386.deb"]
        ```
      parameters:
      - description: Directory to upload files to. Created if does not exist
        in: path
        name: dir
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/_api_files__dir__post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: list of uploaded files
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Server Error
      summary: Upload Files
      tags:
      - Files
  /api/files/{dir}/{name}:
    delete:
      description: |-
        **Delete a uploaded file in upload directory**

        **Example:**
        ```
        $ curl -X DELETE http://localhost:8080/api/files/aptly-0.9/aptly_0.9~dev+217+ge5d646c_i386.deb
        {}
        ```
      parameters:
      - description: Directory to delete from
        in: path
        name: dir
        required: true
        schema:
          type: string
      - description: File to delete
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: msg
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Server Error
      summary: Delete File
      tags:
      - Files
  /api/gpg/key:
    post:
      description: |
        **Adds GPG keys to aptly keyring**

        Add GPG public keys for veryfing remote repositories for mirroring.

        Keys can be added in two ways:
        * By providing the ASCII armord key in `GpgKeyArmor` (leave Keyserver and GpgKeyID empty)
        * By providing a `Keyserver` and one or more key IDs in `GpgKeyID`, separated by space (leave GpgKeyArmor empty)
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/api.gpgAddKeyParams"
        description: Parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Bad Request
      summary: Add GPG Keys
      tags:
      - Mirrors
      x-codegen-request-body-name: request
  /api/graph.{ext}:
    get:
      description: |-
        **Generate dependency graph**

        Command graph generates graph of dependencies:

        * between snapshots and mirrors (what mirror was used to create each snapshot)
        * between snapshots and local repos (what local repo was used to create snapshot)
        * between snapshots (pulling, merging, etc.)
        * between snapshots, local repos and published repositories (how snapshots were published).

        Graph is rendered to PNG file using graphviz package.

        Example URL: `http://localhost:8080/api/graph.svg?layout=vertical`
      parameters:
      - description: "ext specifies desired file extension, e.g. .png, .svg."
        in: path
        name: ext
        required: true
        schema:
          type: string
      - description: Change between a `horizontal` (default) and a `vertical` graph
          layout.
        in: query
        name: layout
        schema:
          type: string
      responses:
        "200":
          content:
            image/png:
              schema:
                items:
                  format: int32
                  type: integer
                type: array
            ' image/svg+xml':
              schema:
                items:
                  format: int32
                  type: integer
                type: array
          description: Output
        "404":
          content:
            image/png:
              schema:
                $ref: "#/components/schemas/api.Error"
            ' image/svg+xml':
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Not Found
        "500":
          content:
            image/png:
              schema:
                $ref: "#/components/schemas/api.Error"
            ' image/svg+xml':
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Server Error
      summary: Graph Output
      tags:
      - Status
  /api/healthy:
    get:
      description: |-
        **Get aptly health state**

        Return aptly health state:
        - `Aptly is healthy` (HTTP 200)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.aptlyStatus"
          description: OK
      summary: Get Health State
      tags:
      - Status
  /api/mirrors:
    get:
      description: |-
        **Show list of currently available mirrors**
        Each mirror is returned as in “show” API.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/github_com_aptly-dev_aptly_deb.RemoteRepo"
                type: array
          description: OK
      summary: List Mirrors
      tags:
      - Mirrors
    post:
      description: '**Create a mirror of a remote repository**'
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/api.mirrorCreateParams"
        description: Parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deb.RemoteRepo"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Bad Request
      summary: Create Mirror
      tags:
      - Mirrors
      x-codegen-request-body-name: request
  /api/mirrors/{name}:
    delete:
      description: '**Delete a mirror**'
      parameters:
      - description: mirror name
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: "force: 1 to enable"
        in: query
        name: force
        required: true
        schema:
          type: integer
      - description: Run in background and return task object
        in: query
        name: _async
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_aptly-dev_aptly_task.ProcessReturnValue"
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Unable to delete mirror with snapshots
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Mirror not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Unable to delete
      summary: Delete Mirror
      tags:
      - Mirrors
    get:
      description: '**Get mirror information by name**'
      parameters:
      - description: mirror name
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deb.RemoteRepo"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Mirror not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Error
      summary: Get Mirror Info
      tags:
      - Mirrors
    put:
      description: '**Update Mirror and download packages**'
      parameters:
      - description: mirror name to update
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Run in background and return task object
        in: query
        name: _async
        schema:
          type: boolean
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/api.mirrorUpdateParams"
        description: Parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/task.ProcessReturnValue"
          description: Mirror was updated successfully
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/task.Task"
          description: Mirror is being updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Unable to determine list of architectures
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Mirror not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Error
      summary: Update Mirror
      tags:
      - Mirrors
      x-codegen-request-body-name: request
  /api/mirrors/{name}/packages:
    get:
      description: '**Get a list of packages from a mirror**'
      parameters:
      - description: mirror name
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: search query
        in: query
        name: q
        schema:
          type: string
      - description: "format: `details` for more detailed information"
        in: query
        name: format
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/deb.Package"
                type: array
          description: List of Packages
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Unable to determine list of architectures
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Mirror not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Error
      summary: List Mirror Packages
      tags:
      - Mirrors
  /api/mirrors/{name}/snapshots:
    post:
      description: '**Create a snapshot of a mirror**'
      parameters:
      - description: Mirror name
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Run in background and return task object
        in: query
        name: _async
        schema:
          type: boolean
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/api.snapshotsCreateFromMirrorParams"
        description: Parameters
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deb.Snapshot"
          description: Created Snapshot
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Mirror Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Conflicting snapshot
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Server Error
      summary: Snapshot Mirror
      tags:
      - Snapshots
      x-codegen-request-body-name: request
  /api/packages:
    get:
      description: '**Get list of packages**'
      parameters:
      - description: search query
        in: query
        name: q
        schema:
          type: string
      - description: "format: `details` for more detailed information"
        in: query
        name: format
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: List of packages
      summary: List Packages
      tags:
      - Packages
  /api/packages/{key}:
    get:
      description: |-
        **Show information about package by package key**
        Package keys could be obtained from various GET .../packages APIs.
      parameters:
      - description: package key (unique package identifier)
        in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deb.Package"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Not Found
      summary: Get Package Info
      tags:
      - Packages
  /api/publish:
    get:
      description: |-
        **Get list of published repositories**

        Return list of published repositories including detailed information.

        See also: `aptly publish list`
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/deb.PublishedRepo"
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Error
      summary: List Published Repositories
      tags:
      - Publish
  /api/publish/{prefix}:
    post:
      description: |-
        **Publish a local repository or snapshot**

        Create a published repository.

        The prefix may contain a storage specifier, e.g. `s3:packages/`, or it may also be empty to publish to the root directory.

        **Example:**
        ```
        $ curl -X POST -H 'Content-Type: application/json' --data '{"Distribution": "wheezy", "Sources": [{"Name": "aptly-repo"}]}' http://localhost:8080/api/publish//repos
        {"Architectures":["i386"],"Distribution":"wheezy","Label":"","Origin":"","Prefix":".","SourceKind":"local","Sources":[{"Component":"main","Name":"aptly-repo"}],"Storage":""}
        ```

        See also: `aptly publish create`
      parameters:
      - description: publishing prefix
        in: path
        name: prefix
        required: true
        schema:
          type: string
      - description: Run in background and return task object
        in: query
        name: _async
        schema:
          type: boolean
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/api.publishedRepoCreateParams"
        description: Parameters
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deb.PublishedRepo"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Source not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Error
      summary: Create Published Repository
      tags:
      - Publish
      x-codegen-request-body-name: request
  /api/publish/{prefix}/{distribution}:
    delete:
      description: |-
        **Delete a published repository**

        Delete a distribution of a published repository and remove associated files.

        If no other published repositories share the same prefix, all files inside the prefix will be removed.

        See also: `aptly publish drop`
      parameters:
      - description: publishing prefix
        in: path
        name: prefix
        required: true
        schema:
          type: string
      - description: distribution name
        in: path
        name: distribution
        required: true
        schema:
          type: string
      - description: "force: 1 to enable"
        in: query
        name: force
        required: true
        schema:
          type: integer
      - description: "skipCleanup: 1 to enable"
        in: query
        name: skipCleanup
        required: true
        schema:
          type: integer
      - description: Run in background and return task object
        in: query
        name: _async
        schema:
          type: boolean
      responses:
        "200":
          content: {}
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Published repository not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Error
      summary: Delete Published Repository
      tags:
      - Publish
    get:
      description: |-
        **Get published repository information**

        Show detailed information of a published repository.

        See also: `aptly publish show`
      parameters:
      - description: "publishing prefix, use `:.` instead of `.` because it is ambigious\
          \ in URLs"
        in: path
        name: prefix
        required: true
        schema:
          type: string
      - description: distribution name
        in: path
        name: distribution
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deb.PublishedRepo"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Published repository not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Error"
          description: Internal Error
