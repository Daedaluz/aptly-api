components:
  schemas:
    api.Error:
      example:
        error: error
      properties:
        error:
          type: string
      type: object
    api.aptlyStatus:
      example:
        Status: "'Aptly is ready', 'Aptly is unavailable', 'Aptly is healthy'"
      properties:
        Status:
          description: Aptly Status
          example: "'Aptly is ready', 'Aptly is unavailable', 'Aptly is healthy'"
          type: string
      type: object
    api.aptlyVersion:
      example:
        Version: Version
      properties:
        Version:
          description: Aptly Version
          type: string
      type: object
    api.diskFree:
      example:
        Total: 1
        PercentFull: 6.027456183070403
        Free: 0
      properties:
        Free:
          description: "Available Storage [MiB]"
          format: int64
          type: integer
        PercentFull:
          description: Percentage Full
          format: float32
          type: number
        Total:
          description: "Storage size [MiB]"
          format: int64
          type: integer
      type: object
    api.gpgAddKeyParams:
      properties:
        GpgKeyArmor:
          description: "Add ASCII armored gpg public key, do not download from keyserver"
          example: ""
          type: string
        GpgKeyID:
          description: "Keys do download from `Keyserver`, separated by space"
          example: EF0F382A1A7B6500 8B48AD6246925553
          type: string
        Keyring:
          description: "Keyring for adding the keys (default: trustedkeys.gpg)"
          example: trustedkeys.gpg
          type: string
        Keyserver:
          description: Keyserver to download keys provided in `GpgKeyID`
          example: hkp://keyserver.ubuntu.com:80
          type: string
      type: object
    api.mirrorCreateParams:
      properties:
        Architectures:
          description: "Limit mirror to those architectures, if not specified aptly\
            \ would fetch all architectures"
          example:
          - amd64
          items:
            type: string
          type: array
        ArchiveURL:
          description: Url of the archive to mirror
          example: http://deb.debian.org/debian
          type: string
        Components:
          description: "Components to mirror, if not specified aptly would fetch all\
            \ components"
          example:
          - main
          items:
            type: string
          type: array
        Distribution:
          description: Distribution name to mirror
          example: "'buster', for flat repositories use './'"
          type: string
        DownloadInstaller:
          description: Set "true" to mirror installer files
          type: boolean
        DownloadSources:
          description: Set "true" to mirror source packages
          type: boolean
        DownloadUdebs:
          description: Set "true" to mirror udeb files
          type: boolean
        Filter:
          description: Package query that is applied to mirror packages
          example: xserver-xorg
          type: string
        FilterWithDeps:
          description: Set "true" to include dependencies of matching packages when
            filtering
          type: boolean
        IgnoreSignatures:
          description: Set "true" to skip the verification of Release file signatures
          type: boolean
        Keyrings:
          description: Gpg keyring(s) for verifying Release file
          example:
          - trustedkeys.gpg
          items:
            type: string
          type: array
        Name:
          description: Name of mirror to be created
          example: mirror2
          type: string
